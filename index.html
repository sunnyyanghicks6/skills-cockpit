<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Cockpit</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3340;
  --txt:#e6edf3; --mut:#8b97a6; --acc:#7aa2f7; --acc2:#bb9af7;
  --good:#3fb950; --warn:#d29922; --bad:#f85149; --chip:#21262d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.app{display:flex;align-items:stretch;min-height:100vh}

/* sidebar */
.side{width:264px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;
  border-right:1px solid var(--line);background:#0b0f14;padding:16px 12px 40px}
.brand{font-size:16px;font-weight:700;letter-spacing:-.3px;padding:2px 6px 12px}
#q{width:100%;padding:9px 11px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;color:var(--txt);font-size:13.5px;outline:none;margin-bottom:14px}
#q:focus{border-color:var(--acc)}
.navgrp{margin-bottom:14px}
.tierhead{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:650;font-size:13px}
.tierhead:hover{background:var(--panel)}
.tierhead.on{background:var(--panel2)}
.tierhead .c{color:var(--mut);font-weight:600;font-size:12px}
.tierhead.common{color:var(--good)} .tierhead.should{color:var(--acc)} .tierhead.never{color:var(--mut)}
.subs{margin:2px 0 2px 6px;border-left:1px solid var(--line);padding-left:6px}
.sub{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--mut)}
.sub:hover{background:var(--panel);color:var(--txt)}
.sub.on{background:var(--acc);color:#0b0f14;font-weight:600}
.sub .c{opacity:.8;font-size:11.5px}
.extra{margin-top:18px;border-top:1px solid var(--line);padding-top:12px}
.extra .sub{color:var(--txt)}
.foot{color:var(--mut);font-size:11px;padding:14px 8px 0;line-height:1.5}

/* main */
.main{flex:1;min-width:0;padding:20px 26px 80px;overflow:auto}
.statbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 13px}
.stat b{font-size:18px} .stat span{color:var(--mut);font-size:11px;margin-left:6px;text-transform:uppercase;letter-spacing:.4px}
.viewhead{margin:6px 0 4px} .viewhead h1{margin:0;font-size:21px;letter-spacing:-.3px}
.viewhead p{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:760px}
.section{margin-top:24px}
.sectit{display:flex;align-items:baseline;gap:10px;font-size:15px;font-weight:700;
  border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:4px}
.sectit .ct{color:var(--mut);font-weight:600;font-size:12px}
.secnote{color:var(--mut);font-size:12.5px;margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px;margin-top:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;
  cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card.cmn{border-left:3px solid var(--good)} .card.shd{border-left:3px solid var(--acc)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card .nm{font-weight:650;font-size:14.5px;letter-spacing:-.2px;word-break:break-word}
.card .inv{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--acc2);
  background:var(--panel2);padding:1px 6px;border-radius:5px;white-space:nowrap}
.card .ds{color:var(--mut);font-size:12.5px;flex:1}
.card .why{font-size:12px;color:var(--acc);background:rgba(122,162,247,.08);
  border-radius:6px;padding:6px 8px}
.badges{display:flex;flex-wrap:wrap;gap:5px}
.b{font-size:10.5px;padding:2px 7px;border-radius:11px;border:1px solid var(--line);color:var(--mut)}
.b.pt{color:var(--acc2);border-color:#33304a}
.b.proj{color:var(--warn);border-color:#4a3f22}
.usage{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--mut)}
.bar{height:5px;background:var(--panel2);border-radius:4px;flex:1;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--acc))}
.never-u{color:var(--mut)}
.empty{color:var(--mut);padding:30px;text-align:center}

/* sequences + recs */
.seq{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:10px}
.seq .nm{font-weight:650} .seq .why{color:var(--mut);font-size:12.5px;margin:3px 0 9px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .st{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:4px 9px;
  font-family:ui-monospace,monospace;font-size:12px;cursor:pointer}
.flow .st:hover{border-color:var(--acc)} .flow .ar{color:var(--mut)}
.rec{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc2);
  border-radius:8px;padding:12px 14px;margin-bottom:9px}
.rec .nm{font-weight:600;margin-bottom:3px} .rec .why{color:var(--mut);font-size:12.5px}
.rec .ins{color:var(--good);font-size:11.5px;margin-top:6px;font-family:ui-monospace,monospace}

/* modal */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:30;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
#ov.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;max-width:680px;width:100%;padding:22px}
.modal h2{margin:0;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal .minv{font-family:ui-monospace,monospace;color:var(--acc2);font-size:14px;background:var(--panel2);padding:2px 8px;border-radius:6px}
.modal .row{margin-top:14px}
.modal .k{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:4px}
.modal .v{font-size:13.5px} .modal pre{white-space:pre-wrap;word-break:break-word;margin:0;font:13px/1.55 inherit;color:var(--txt)}
.close{margin-left:auto;cursor:pointer;color:var(--mut);font-size:24px;line-height:1}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--chip);border:1px solid var(--line);border-radius:13px;padding:3px 9px;font-size:12px;cursor:pointer}

.menubtn{display:none}
@media(max-width:860px){
  .app{flex-direction:column}
  .side{position:static;width:auto;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  .main{padding:16px}
}
</style></head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">🛫 Skills Cockpit</div>
    <input id="q" placeholder="Search…  ( / )" autocomplete="off">
    <div id="nav"></div>
    <div class="foot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="statbar" id="statbar"></div>
    <div id="view"></div>
  </main>
</div>
<div id="ov"><div class="modal" id="modal"></div></div>

  const extra=Object.keys(m).filter(k=>!(k in CAT)).sort();
  return ordered.concat(extra).map(k=>{
    const n=CAT[k]||{label:k,note:"",project_type:""};
    return {key:k,label:n.label||k,note:n.note||"",pt:n.project_type||"",skills:sortSk(m[k])};
  });
}

/* ---------- sidebar ---------- */
function tierGroups(tier){return tier==="never"?neverGroups():byPtype(tier);}
function renderNav(){
  const tiers=[["common","Commonly used"],["should","Should use"],["never","Never used"]];
  let h="";
  for(const [t,label] of tiers){
    const groups=tierGroups(t);
    const total=DATA.summary[t]||0;
    const headOn = cur.kind==="tier"&&cur.tier===t&&!cur.group ? " on":"";
    h+=`<div class="navgrp"><div class="tierhead ${t}${headOn}" data-tier="${t}">`+
       `<span>${label}</span><span class="c">${total}</span></div><div class="subs">`+
       groups.map(g=>{
         const on = cur.kind==="tier"&&cur.tier===t&&cur.group===g.key ? " on":"";
         return `<div class="sub${on}" data-tier="${t}" data-group="${encodeURIComponent(g.key)}">`+
                `<span>${esc(g.label)}</span><span class="c">${g.skills.length}</span></div>`;
       }).join("")+`</div></div>`;
  }
  h+=`<div class="extra">`+
     `<div class="sub" data-view="seq"><span>★ Workflow sequences</span><span class="c">${DATA.sequences.length}</span></div>`+
     `<div class="sub" data-view="rec"><span>💡 Recommendations</span><span class="c">${DATA.recommendations.length}</span></div>`+
     `<div class="sub" data-view="all"><span>🗂 All skills</span><span class="c">${DATA.summary.total}</span></div>`+
     `</div>`;
  $("#nav").innerHTML=h;
}

/* ---------- cards ---------- */
function cardHTML(s){
  const pct=Math.round(s.count/maxCount*100);
  const cls = s.tier==="common"?"cmn":s.tier==="should"?"shd":"";
  const usage = s.used
    ? `<div class="usage"><div class="bar"><i style="width:${Math.max(5,pct)}%"></i></div>${s.count}× · ${s.sessions} sess · ${esc(s.last_h)}</div>`
    : `<div class="usage never-u">○ never used</div>`;
  const why = (s.tier==="should"&&s.should_for&&s.should_for.length)
    ? `<div class="why">▸ ${esc(s.should_for[0].why)}</div>` : "";
  const proj = s.origin.indexOf("project:")===0
    ? `<span class="b proj">${esc(s.origin)}</span>` : "";
  const ptTags=(s.ptypes||[]).slice(0,2).map(p=>`<span class="b pt">${esc(p.split(" ")[0])}</span>`).join("");
  return `<div class="card ${cls}" data-skill="${encodeURIComponent(s.name)}">`+
    `<div class="top"><span class="nm">${esc(s.name)}</span><span class="inv">${esc(s.invoke)}</span></div>`+
    `<div class="ds">${esc(s.short)}</div>${why}`+
    `<div class="badges">${ptTags}${proj}</div>${usage}</div>`;
}
function sectionHTML(title,note,skills){
  return `<div class="section"><div class="sectit">${esc(title)} <span class="ct">${skills.length}</span></div>`+
    (note?`<div class="secnote">${note}</div>`:"")+
    `<div class="grid">${skills.map(cardHTML).join("")}</div></div>`;
}
function viewHead(h1,p){return `<div class="viewhead"><h1>${esc(h1)}</h1><p>${esc(p)}</p></div>`;}

/* ---------- main views ---------- */
function renderMain(){
  const q=$("#q").value.trim().toLowerCase();
  const v=$("#view");
  if(q){
    const hits=sortSk(DATA.skills.filter(s=>(s.name+" "+s.desc+" "+(s.ptypes||[]).join(" ")+" "+s.invoke).toLowerCase().includes(q)));
    v.innerHTML=viewHead("Search","Matches across every tier and project type.")+
      (hits.length?`<div class="section"><div class="sectit">Results <span class="ct">${hits.length}</span></div><div class="grid">${hits.map(cardHTML).join("")}</div></div>`:`<div class="empty">No skills match “${esc(q)}”.</div>`);
    return;
  }
  if(cur.kind==="seq"){
    v.innerHTML=viewHead("Workflow sequences","Skill chains worth memorizing. Click any step to inspect it.")+
      DATA.sequences.map(seqHTML).join(""); return;
  }
  if(cur.kind==="rec"){
    v.innerHTML=viewHead("Recommendations","What to adopt next, and where you’re leaving skills on the table.")+
      DATA.recommendations.map(r=>`<div class="rec"><div class="nm">${esc(r.title)}</div><div class="why">${esc(r.why)}</div>${r.install?`<div class="ins">▸ ${esc(r.install)}</div>`:""}</div>`).join("")+
      `<div class="section"><div class="sectit">Installed but never used <span class="ct">${DATA.unused_top.length}</span></div>`+
      `<div class="secnote">The long tail — see “Never used” in the sidebar, grouped by what kind of project each serves.</div>`+
      `<div class="pill-list">${DATA.unused_top.slice(0,60).map(n=>`<span class="pill" data-skill="${encodeURIComponent(n)}">${esc(n)}</span>`).join("")}${DATA.unused_top.length>60?` <span class="pill">+${DATA.unused_top.length-60} more</span>`:""}</div></div>`;
    return;
  }
  if(cur.kind==="all"){
    let h=viewHead("All skills","Everything, grouped by usage tier.");
    [["common","Commonly used"],["should","Should use"],["never","Never used"]].forEach(([t,l])=>{
      h+=sectionHTML(l, "", sortSk(inTier(t)));
    });
    v.innerHTML=h; return;
  }
  // tier view
  const tier=cur.tier;
  let groups=tierGroups(tier);
  if(cur.group) groups=groups.filter(g=>g.key===cur.group);
  const heads={
    common:["Commonly used","Skills you actually invoke, grouped by the kind of project they serve."],
    should:["Should use","High-value skills you haven’t adopted yet — for your project types. Each card says why and when."],
    never:["Never used","Installed but never invoked — grouped by toolkit, each labeled with the project type it serves."]
  };
  let h=viewHead(heads[tier][0],heads[tier][1]);
  if(!groups.length) h+=`<div class="empty">Nothing here.</div>`;
  else h+=groups.map(g=>{
    let note="";
    if(tier==="never") note=(g.note?esc(g.note):"")+(g.pt?` · <b>${esc(g.pt)}</b>`:"");
    return sectionHTML(g.label, note, g.skills);
  }).join("");
  v.innerHTML=h;
}
function seqHTML(q){
  return `<div class="seq"><div class="nm">${esc(q.name)}</div><div class="why">${esc(q.why||"")}</div>`+
    `<div class="flow">${q.steps.map((st,i)=>`${i?'<span class="ar">→</span>':''}<span class="st" data-skill="${encodeURIComponent(st)}">${esc(st)}</span>`).join("")}</div></div>`;
}

/* ---------- modal ---------- */
function openModal(s){
  if(!s)return;
  const usedIn=DATA.sequences.filter(q=>q.steps.includes(s.name)).map(q=>q.name);
  const rows=[];
  rows.push(`<div class="row"><div class="k">How to invoke</div><div class="v"><span class="minv">${esc(s.invoke)}</span> ${s.kind==='command'?'(slash command)':s.invoke.charAt(0)==='/'?'(type it, or just describe the task)':'(invoked by name / when you describe the task)'}</div></div>`);
  if(s.origin.indexOf("project:")===0)
    rows.push(`<div class="row"><div class="k">Scope</div><div class="v never-u">⚑ Project skill — only available inside the <b>${esc(s.origin.split(":")[1])}</b> repo.${s.scope_note?" "+esc(s.scope_note):""}</div></div>`);
  rows.push(`<div class="row"><div class="k">For what kind of project</div><div class="v pill-list">${(s.ptypes||[]).map(p=>`<span class="pill">${esc(p)}</span>`).join("")||'<span class="never-u">General</span>'}</div></div>`);
  if(s.should_for&&s.should_for.length)
    rows.push(`<div class="row"><div class="k">Why adopt it</div><div class="v">${s.should_for.map(x=>`<div>▸ ${esc(x.why)} <span class="never-u">(${esc(x.pt)})</span></div>`).join("")}</div></div>`);
  rows.push(`<div class="row"><div class="k">Description</div><div class="v"><pre>${esc(s.desc||s.short)}</pre></div></div>`);
  if(s.triggers&&s.triggers.length)
    rows.push(`<div class="row"><div class="k">Trigger phrases</div><div class="v pill-list">${s.triggers.map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div></div>`);
  rows.push(`<div class="row"><div class="k">Usage</div><div class="v">${s.used?`${s.count} attributed turns · ${s.sessions} sessions · last ${esc(s.last_h)}`:'<span class="never-u">Never used yet</span>'}</div></div>`);
  if(usedIn.length)
    rows.push(`<div class="row"><div class="k">Part of sequence</div><div class="v pill-list">${usedIn.map(n=>`<span class="pill">${esc(n)}</span>`).join("")}</div></div>`);
  if(s.path) rows.push(`<div class="row"><div class="k">Source</div><div class="v" style="font-family:ui-monospace,monospace;font-size:12px;color:var(--mut)">${esc(s.path)}</div></div>`);
  $("#modal").innerHTML=`<h2>${esc(s.name)} <span class="minv">${esc(s.invoke)}</span><span class="close" id="x">×</span></h2>`+
    `<div class="badges" style="margin-top:8px"><span class="b">${esc(s.origin)}</span><span class="b pt">${esc(s.tier)}</span></div>`+rows.join("");
  $("#ov").classList.add("on");
  $("#x").onclick=closeModal;
}
function closeModal(){$("#ov").classList.remove("on");}
$("#ov").onclick=e=>{if(e.target.id==="ov")closeModal();};

/* ---------- header + wiring ---------- */
function renderStats(){
  const S=DATA.summary;
  const cells=[["Total",S.total],["Common",S.common],["Should use",S.should],["Never",S.never],["Invocations",S.invocations.toLocaleString()]];
  $("#statbar").innerHTML=cells.map(([l,v])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("#foot").innerHTML=`${S.total} skills · generated ${esc(S.generated)}<br>Re-run <b>/skills</b> to refresh.`;
}
function render(){renderNav();renderMain();}

$("#nav").addEventListener("click",e=>{
  const head=e.target.closest(".tierhead");
  const sub=e.target.closest(".sub");
  if(head){cur={kind:"tier",tier:head.dataset.tier,group:null};$("#q").value="";render();return;}
  if(sub){
    if(sub.dataset.view){cur={kind:sub.dataset.view};$("#q").value="";render();return;}
    cur={kind:"tier",tier:sub.dataset.tier,group:decodeURIComponent(sub.dataset.group)};$("#q").value="";render();
  }
});
document.body.addEventListener("click",e=>{
  const el=e.target.closest("[data-skill]");
  if(el){openModal(byName[decodeURIComponent(el.dataset.skill)]);}
});
$("#q").addEventListener("input",renderMain);
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("#q")){e.preventDefault();$("#q").focus();}
  if(e.key==="Escape"){closeModal();$("#q").blur();}
});

renderStats();render();
</script>
</body></html>
